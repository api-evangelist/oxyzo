name: Oxyzo
description: 'Oxyzo Financial Services is an RBI-registered Non-Banking Financial Company (NBFC)
  providing customized SME and corporate financing across India. Founded as the lending arm of the
  OfBusiness group, Oxyzo offers purchase finance, work order finance, invoice discounting, vendor
  finance, business loans, machinery finance, and loan against property, serving industries such as
  auto manufacturing, capital goods, e-mobility, logistics, pharmaceuticals, and textiles. The company
  operates 145+ branches, has powered 10,000+ businesses, disbursed over Rs 77,000 crore, and holds
  A+ ratings from CRISIL and ICRA. Oxyzo publishes no public developer/API surface; this profile
  captures its identity and domain-security posture for the API Evangelist network.'
